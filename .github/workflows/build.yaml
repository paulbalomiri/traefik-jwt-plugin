name: Build
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.puml'
  pull_request:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Traefik interprets a plugin with Yaegi: the version and the Go release are the ones Traefik v3.7 is built with.
      GO_VERSION: "1.27"
      YAEGI_VERSION: v0.16.3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -cover ./...
      - name: test under yaegi
        run: |
          go install github.com/traefik/yaegi/cmd/yaegi@${YAEGI_VERSION}
          module=$(go list -m)
          gopath=$(mktemp -d)
          mkdir -p "$gopath/src/$(dirname "$module")"
          ln -s "$PWD" "$gopath/src/$module"
          # by its import path, as Traefik loads a plugin: its vendor directory is found that way
          GOPATH="$gopath" "$(go env GOPATH)/bin/yaegi" test -v "$module"
